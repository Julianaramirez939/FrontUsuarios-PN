<div class="dashboard-container">
  <!-- Sidebar -->
  <aside class="dashboard-sidebar">
    <nav class="sidebar-menu">
      <ul>
        <li (click)="irARuta('horarios')">
          <i class="fa-solid fa-calendar sidebar-icon"></i>
          <span>Ver Horarios</span>
        </li>
        <li (click)="irARuta('roles')">
          <i class="fa-solid fa-users sidebar-icon"></i>
          <span>Roles</span>
        </li>
        <li (click)="irARuta('usuarios')">
          <i class="fa-regular fa-user sidebar-icon"></i>
          <span>Usuarios</span>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main Area -->
  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="header-role">Administración</div>

      <div class="header-user">
        <button (click)="alternarMenuUsuario()" class="user-dropdown-toggle">
          <i class="fa-regular fa-circle-user user-icon"></i>
          <span>Santiago Rincón</span>
        </button>

        <div class="user-dropdown-menu" *ngIf="mostrarMenuUsuario">
          <button (click)="irARuta('miperfil')">
            <i class="fa-regular fa-circle-user"></i> Mi perfil
          </button>
          <button (click)="cerrarSesion()">
            <i class="fa-solid fa-sign-out-alt"></i> Cerrar sesión
          </button>
        </div>
      </div>
    </header>

    <section class="dashboard-content">
      <h1 *ngIf="esDashboardPrincipal">
        Bienvenido al panel de administración
      </h1>
      <router-outlet *ngIf="!esDashboardPrincipal"></router-outlet>
    </section>
  </main>
</div>
